[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pix2geo"
dynamic = ["version"]
description = "Camera pixel to geographic coordinate by ray casting against a digital elevation model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pyproj>=3.4",
    "rasterio>=1.3",
]

[project.optional-dependencies]
numba = ["numba>=0.57"]
# CuPy has one wheel for each CUDA major version.
cuda12 = ["cupy-cuda12x>=12"]
cuda13 = ["cupy-cuda13x>=13.6"]
test = ["pytest>=7"]
dev = ["pix2geo[test]", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
pix2geo = "pix2geo.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pix2geo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # rasterio 1.4 sets ndarray.shape inside read(), which NumPy 2.5 deprecates.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["*.md"]  # keep the aligned comments in the README examples

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "SIM", "C4", "PIE", "RUF", "ANN"]
ignore = [
    "SIM108",  # if/else blocks read better than long ternaries in the kernels
    "ANN401",  # Any is the required type for **kwargs, CRS inputs, and NumPy indices
]

[tool.ruff.lint.per-file-ignores]
"src/pix2geo/__init__.py" = ["RUF022"]  # __all__ is grouped by topic
"tests/*" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["pix2geo", "conftest"]

[tool.mypy]
files = ["src/pix2geo", "examples", "benchmarks"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false

[[tool.mypy.overrides]]
# No type information (affine, rasterio, scipy), or optional (cupy, cupyx, numba).
module = ["affine.*", "cupy.*", "cupyx.*", "numba.*", "rasterio.*", "scipy.*"]
ignore_missing_imports = true
